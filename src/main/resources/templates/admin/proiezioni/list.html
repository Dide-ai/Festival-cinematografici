<!DOCTYPE html>
<html>

<head>
	<title>SiwFestival - Proiezioni</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<form th:action="@{/logout}" method="POST" style="display:inline;">
				<button type="submit">Logout</button>
			</form>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
	</header>

	<div>
		<a href="/"><img src="/images/logo-siw.png" width="50%" /></a>
	</div>

	<h1>Proiezioni</h1>
	<div th:if="${elencoProiezioni == null || elencoProiezioni.isEmpty()}">Non ci sono proiezioni nel sistema</div>
	<ul>
		<li th:each="proiezione : ${elencoProiezioni}">
			<span th:text="${proiezione.data} + ' ' + ${proiezione.ora}">data e ora</span>
			<span th:text="' - ' + ${proiezione.film.titolo} + ' - ' + ${proiezione.sala.nome}">film e sala</span>
			<span th:text="' - ' + ${proiezione.festival.nome} + ' [' + ${proiezione.stato} + ']'">festival</span>
			<a th:href="@{'/admin/proiezioni/' + ${proiezione.id} + '/modifica'}">Modifica</a>
			<form th:action="@{'/admin/proiezioni/' + ${proiezione.id} + '/annulla'}" method="POST"
				style="display:inline;">
				<button type="submit">Annulla</button>
			</form>
			<form th:action="@{'/admin/proiezioni/' + ${proiezione.id} + '/elimina'}" method="POST"
				style="display:inline;">
				<button type="submit">Elimina</button>
			</form>
		</li>
	</ul>

	<div><a href="/admin/proiezioni/nuova">Programma una proiezione</a></div>
	<div><a href="/admin/index">Torna alla gestione</a></div>
</body>

</html>

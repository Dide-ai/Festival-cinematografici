<!DOCTYPE html>
<html>

<head>
	<title>SiwFestival - Regista</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<form th:action="@{/logout}" method="POST" style="display:inline;">
				<button type="submit">Logout</button>
			</form>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
	</header>

	<div>
		<a href="/"><img src="/images/logo-siw.png" width="50%" /></a>
	</div>

	<h1 th:text="${regista.id} == null ? 'Aggiungi un regista' : 'Modifica il regista'">Regista</h1>
	<form th:action="@{/admin/registi}" method="POST" th:object="${regista}">
		<div th:if="${#fields.hasGlobalErrors()}">
			<p th:each="err : ${#fields.globalErrors()}" th:text="${err}">...</p>
		</div>
		<input type="hidden" th:field="*{id}" />
		<div>
			Nome: <span><input type="text" th:field="*{nome}" /></span>
			<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
		</div>
		<div>
			Cognome: <span><input type="text" th:field="*{cognome}" /></span>
			<span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}"></span>
		</div>
		<div>
			Data di nascita: <span><input type="date" th:field="*{dataNascita}" /></span>
			<span th:if="${#fields.hasErrors('dataNascita')}" th:errors="*{dataNascita}"></span>
		</div>
		<div>
			Nazionalita: <span><input type="text" th:field="*{nazionalita}" /></span>
			<span th:if="${#fields.hasErrors('nazionalita')}" th:errors="*{nazionalita}"></span>
		</div>
		<div>
			<span><button type="submit">Conferma</button></span>
		</div>
	</form>
	<div><a href="/registi">Torna ai registi</a></div>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
	<title>SiwFestival - Film</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<form th:action="@{/logout}" method="POST" style="display:inline;">
				<button type="submit">Logout</button>
			</form>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
	</header>

	<div>
		<a href="/"><img src="/images/logo-siw.png" width="50%" /></a>
	</div>

	<h1>Film</h1>
	<div th:if="${elencoFilm == null || elencoFilm.isEmpty()}">Non ci sono film nel sistema</div>
	<ul>
		<li th:each="film : ${elencoFilm}">
			<a th:href="@{'/film/' + ${film.id}}" th:text="${film.titolo}">titolo</a>
			<span th:text="'(' + ${film.anno} + ') - ' + ${film.regista.nome} + ' ' + ${film.regista.cognome}">regista</span>
		</li>
	</ul>

	<div th:if="${isAdmin}"><a href="/admin/film/nuovo">Aggiungi un film</a></div>
</body>

</html>

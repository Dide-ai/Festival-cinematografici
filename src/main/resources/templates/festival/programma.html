<!DOCTYPE html>
<html>

<head>
	<title>SiwFestival - Programma</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<form th:action="@{/logout}" method="POST" style="display:inline;">
				<button type="submit">Logout</button>
			</form>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
	</header>

	<div>
		<a href="/"><img src="/images/logo-siw.png" width="50%" /></a>
	</div>

	<h1 th:text="'Programma di ' + ${festival.nome}">Programma</h1>
	<div><a th:href="@{'/festival/' + ${festival.id}}">Torna al festival</a></div>

	<!-- unico template con un tag script: e' il punto di innesto della componente React.
	     Il festivalId passa da Thymeleaf a React con un data-attribute. -->
	<div id="root" th:attr="data-festival-id=${festival.id}"></div>
	<script type="module" src="/react/programma.js"></script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
	<title>SiwFestival - Errore</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<form th:action="@{/logout}" method="POST" style="display:inline;">
				<button type="submit">Logout</button>
			</form>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
	</header>

	<div>
		<a href="/"><img src="/images/logo-siw.png" width="50%" /></a>
	</div>

	<h1>Operazione non riuscita</h1>
	<!-- errorMessage lo mette GlobalExceptionHandler. Gli errori che nascono nei filtri di
	     Spring Security (403 su /admin/**) arrivano invece qui come fallback di Spring Boot,
	     senza passare dal @ControllerAdvice: in quel caso ci sono solo status ed error. -->
	<p th:if="${errorMessage}" th:text="${errorMessage}">Messaggio di errore</p>
	<p th:unless="${errorMessage}" th:text="${status} + ' - ' + ${error}">403 - Forbidden</p>
	<div><a href="/">Torna alla homepage</a></div>
</body>

</html>

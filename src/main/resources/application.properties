spring.application.name=siwfestival
spring.datasource.url=jdbc:postgresql://localhost:5432/siwfestival
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
# scelta consapevole: la sessione JPA resta aperta fino al rendering della vista.
# Evita LazyInitializationException nei template Thymeleaf, ma maschera le query N+1
# (per questo lo script di analisi apre transazioni proprie).
spring.jpa.open-in-view=true
# senza questa riga th:field su un LocalDate stampa il formato breve della locale
# (10/10/25) e un <input type="date"> lo mostra vuoto: il formato ISO e' quello che
# l'input HTML manda e si aspetta di ricevere.
spring.mvc.format.date=iso
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
#==================================
# = Messages configuration
#==================================
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
#==================================
# = Logging configuration
#==================================
logging.level.root=INFO

# Questo file SOSTITUISCE per intero quello di src/main/resources, non lo integra:
# per questo ripete anche le credenziali del database.
spring.datasource.url=jdbc:postgresql://localhost:5432/siwfestival_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.show-sql=false
# metti a true per far vedere le query generate da Hibernate

# Nei test non si renderizzano viste: nessuna sessione deve restare aperta oltre la
# transazione a mascherare le query, che e' esattamente cio' che lo script del §8.2 misura.
spring.jpa.open-in-view=false
